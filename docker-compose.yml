version: '3.8'

services:
  # ==========================================
  # Backend API Service
  # ==========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: expensetracker_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - expensetracker_net

  # ==========================================
  # Frontend Service (Nginx on Port 80 & Port 8080)
  # ==========================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: expensetracker_frontend
    restart: always
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      - backend
    networks:
      - expensetracker_net

networks:
  expensetracker_net:
    driver: bridge
