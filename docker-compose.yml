version: '3.8'

services:
  # ==========================================
  # Database Service (Local MongoDB for containerized dev/testing)
  # ==========================================
  mongodb:
    image: mongo:latest
    container_name: expensetracker_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: expensedb
    volumes:
      - mongo_data:/data/db
    networks:
      - expensetracker_net

  # ==========================================
  # Backend API Service
  # ==========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: expensetracker_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Connects to containerized mongodb service or Atlas URI
      - MONGO_URI=mongodb://mongodb:27017/expensedb
      - JWT_SECRET=change_this_super_secret_key_for_production_2026
      - JWT_EXPIRE=7d
      - CORS_ORIGIN=http://localhost:80,http://localhost:5173
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - expensetracker_net

  # ==========================================
  # Frontend Service (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: expensetracker_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - expensetracker_net

volumes:
  mongo_data:

networks:
  expensetracker_net:
    driver: bridge
