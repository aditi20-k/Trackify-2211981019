apiVersion: apps/v1
kind: Deployment
metadata:
  name: expensetracker-frontend
  labels:
    app: expensetracker-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expensetracker-frontend
  template:
    metadata:
      labels:
        app: expensetracker-frontend
    spec:
      containers:
        - name: frontend
          image: aditikapoor20/expensetracker-frontend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  selector:
    app: expensetracker-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
